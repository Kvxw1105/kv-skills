<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adaptive H5 Starter</title>
<style>
:root{color-scheme:light dark;--bg:#f5f3ef;--surface:#fff;--text:#171717;--muted:#6d6d6d;--accent:#ff6b35;--line:rgba(0,0,0,.10);--r:22px;--s1:8px;--s2:12px;--s3:18px;--s4:26px}
@media(prefers-color-scheme:dark){:root{--bg:#111;--surface:#1b1b1b;--text:#f7f7f7;--muted:#aaa;--line:rgba(255,255,255,.12)}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}
.app{min-height:100dvh;padding:max(var(--s2),env(safe-area-inset-top)) max(var(--s2),env(safe-area-inset-right)) max(var(--s2),env(safe-area-inset-bottom)) max(var(--s2),env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--s2);container-type:size}
.header{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);max-width:1440px;width:100%;margin:auto}.brand{font-weight:800;letter-spacing:.02em}.meta{color:var(--muted);font-size:14px}
.layout{width:min(100%,1440px);margin:auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"primary" "secondary" "actions";gap:var(--s2);align-content:start}.region{min-width:0;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,2.4cqmin,28px)}.primary{grid-area:primary}.secondary{grid-area:secondary}.actions{grid-area:actions;display:flex;flex-wrap:wrap;gap:var(--s1);align-content:flex-start}
.hero{font-size:clamp(28px,6cqi,62px);line-height:1;margin:0 0 var(--s2)}.desc{color:var(--muted);max-width:58ch}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,88px),1fr));gap:var(--s1);margin-top:var(--s3)}.tile,.btn{min-height:44px;border:0;border-radius:14px}.tile{background:color-mix(in srgb,var(--accent) 16%,var(--surface));font-weight:800;font-size:clamp(18px,4cqi,30px)}.btn{padding:0 18px;background:var(--accent);color:white;font-weight:750}.btn.secondary-btn{background:transparent;color:var(--text);border:1px solid var(--line)}
@container (min-width:720px){.layout{grid-template-columns:minmax(0,1.6fr) minmax(220px,.8fr);grid-template-areas:"primary actions" "secondary actions";align-content:center}.actions{position:sticky;top:var(--s2)}}
@container (min-width:1080px) and (min-height:560px){.layout{grid-template-columns:minmax(180px,.7fr) minmax(420px,1.7fr) minmax(230px,.8fr);grid-template-areas:"secondary primary actions";align-content:center}}
@container (max-height:480px){.app{overflow:auto}.layout{align-content:start}.region{padding:12px}.hero{font-size:clamp(24px,6cqh,40px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" data-app-shell>
<header class="header"><div class="brand">作品名称</div><div class="meta">轻量互动体验</div></header>
<main class="layout">
<section class="region primary"><h1 class="hero">唯一核心动作</h1><p class="desc">把这里替换成三秒可理解的规则。主要操作应处于视觉中心，并保持完整反馈。</p><div class="controls" aria-label="核心操作"><button class="tile">A</button><button class="tile">B</button><button class="tile">C</button><button class="tile">D</button></div></section>
<aside class="region secondary"><strong>进度或说明</strong><p class="desc">次要信息在空间不足时可以换行、折叠或下移。</p></aside>
<aside class="region actions"><button class="btn">主要操作</button><button class="btn secondary-btn">辅助操作</button></aside>
</main>
</div>
<script>
const shell=document.querySelector('[data-app-shell]');
new ResizeObserver(([entry])=>{const {width,height}=entry.contentRect;shell.dataset.layout=width>=1080&&height>=560?'spacious':width>=720?'compact':'portrait';}).observe(shell);
</script>
</body>
</html>
