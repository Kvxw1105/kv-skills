<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fffaf1">
<title>词觉 LexiSense｜每日 12 词挑战</title>
<meta name="description" content="每天 12 个词，测测你的单词直觉。词觉 LexiSense 是一款轻量、限时的每日拼词挑战。">
<meta property="og:type" content="website">
<meta property="og:title" content="词觉 LexiSense｜每日 12 词挑战">
<meta property="og:description" content="每天 12 个词，测测你的单词直觉。">
<style>

:root{
  --ink:#17181c;--muted:#6f7075;--paper:#fffaf1;--paper2:#f5f0e7;
  --tile:#ece7dc;--soft:#dcd8cf;--ok:#29ad68;--bad:#ed5d57;
  --accent:#f19a54;--glow:rgba(241,154,84,.18);--surface:rgba(255,255,255,.82);
  --surface-soft:rgba(255,255,255,.66);--button-soft:rgba(243,241,236,.86);
  --line:#9a9a9a;--key-shadow:#d4cec2;--dark-key:#17181c;--dark-key-shadow:#050505;
  --icon-bg:rgba(255,255,255,.56);--shadow:rgba(62,48,30,.08);
}
:root[data-theme="dark"]{
  --ink:#f4f1ea;--muted:#aaa9b0;--paper:#111217;--paper2:#1b1c23;
  --tile:#2a2b33;--soft:#34353d;--ok:#35c57a;--bad:#ff6861;
  --accent:#f2a45f;--glow:rgba(242,164,95,.13);--surface:rgba(31,32,39,.88);
  --surface-soft:rgba(42,43,51,.74);--button-soft:rgba(38,39,47,.9);
  --line:#74757e;--key-shadow:#17181f;--dark-key:#f2efe8;--dark-key-shadow:#b9b5ad;
  --icon-bg:rgba(39,40,48,.74);--shadow:rgba(0,0,0,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--paper2)}
body{
  min-height:100%;margin:0;overflow:hidden;color:var(--ink);background:
  radial-gradient(circle at 15% 15%,var(--glow),transparent 30%),
  radial-gradient(circle at 85% 80%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 28%),
  var(--paper2);
  transition:background .45s ease,color .35s ease;
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
body[data-overflow="true"]{overflow:auto}
button{font:inherit;color:inherit}
#ambient{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

/*
  Adaptive Layout Contract
  ------------------------
  The ResizeObserver supplies --fit and one of three semantic layout modes.
  All component dimensions derive from the same scale tokens, so the page
  cannot enter a mixed state where keys, timer and controls shrink at
  unrelated rates.
*/
.app{
  --fit:1;
  --gap-1:clamp(4px,calc(6px * var(--fit)),8px);
  --gap-2:clamp(7px,calc(10px * var(--fit)),13px);
  --gap-3:clamp(10px,calc(16px * var(--fit)),20px);
  --header-h:clamp(36px,calc(42px * var(--fit)),48px);
  --icon-size:clamp(34px,calc(38px * var(--fit)),44px);
  --progress-size:clamp(25px,calc(38px * var(--fit)),48px);
  --timer-size:clamp(48px,calc(76px * var(--fit)),92px);
  --meta-size:clamp(14px,calc(18px * var(--fit)),21px);
  --slot-w:clamp(38px,calc(50px * var(--fit)),58px);
  --slot-h:clamp(44px,calc(58px * var(--fit)),66px);
  --letter-size:clamp(58px,calc(86px * var(--fit)),100px);
  --letter-font:clamp(25px,calc(34px * var(--fit)),39px);
  --control-h:clamp(40px,calc(46px * var(--fit)),54px);
  position:relative;z-index:1;
  width:100%;height:100dvh;min-height:0;margin:0;
  padding:max(8px,env(safe-area-inset-top)) clamp(12px,3vw,22px) max(10px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;overflow:hidden;
  container-type:inline-size;container-name:app;
}
.app[data-overflow="true"]{height:auto;min-height:100dvh;overflow:visible}
.app[data-overflow="true"] .screen.active{flex:0 0 auto}
.app[data-overflow="true"][data-layout="portrait"] .game{grid-template-rows:auto auto auto}
.app[data-overflow="true"] .play-panel{overflow:visible}
.top{
  height:var(--header-h);display:flex;align-items:center;justify-content:space-between;
  flex:0 0 auto;min-width:0;
}
.top-actions{display:flex;align-items:center;gap:var(--gap-1)}
.logo{display:flex;align-items:baseline;gap:8px;font-weight:950;letter-spacing:-.045em;min-width:0}
.logo .brand-cn{font-size:clamp(18px,calc(23px * var(--fit)),27px);color:var(--accent);white-space:nowrap}
.logo .brand-en{font-size:clamp(9px,calc(11px * var(--fit)),13px);letter-spacing:.12em;color:var(--muted);font-weight:900;white-space:nowrap}
.icon{
  border:0;background:var(--icon-bg);backdrop-filter:blur(10px);width:var(--icon-size);height:var(--icon-size);
  border-radius:50%;font-size:clamp(17px,calc(19px * var(--fit)),22px);display:grid;place-items:center;
  box-shadow:0 4px 16px var(--shadow);transition:transform .2s ease,background .35s ease,color .35s ease;
}
.icon:active{transform:scale(.91)}
.screen{display:none;flex:1;min-height:0;min-width:0}
.screen.active{display:flex}

/* Home and result stay content-first and never stretch text across a wide monitor. */
.home,.result{width:min(100%,650px);align-self:center}
.home{flex-direction:column;justify-content:center;padding:clamp(20px,6vh,70px) 4px;text-align:left}
.home .mini{font-size:clamp(10px,calc(12px * var(--fit)),13px);letter-spacing:.18em;color:var(--muted);font-weight:900;margin-bottom:var(--gap-3)}
.home h1{font-size:clamp(48px,calc(76px * var(--fit)),92px);line-height:.92;letter-spacing:-.075em;margin:0 0 var(--gap-3);font-weight:950}
.home p{font-size:clamp(15px,calc(17px * var(--fit)),19px);line-height:1.62;color:var(--muted);margin:0 0 calc(var(--gap-3) * 1.4);max-width:540px;font-weight:650}
.case-picker{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;margin:0 0 var(--gap-3);background:color-mix(in srgb,var(--tile) 78%,transparent);border-radius:999px;width:min(100%,350px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 5%,transparent)}
.case-option{border:0;border-radius:999px;min-height:42px;background:transparent;color:var(--muted);font-size:14px;font-weight:900;transition:background .25s ease,color .25s ease,transform .22s ease,box-shadow .25s ease}
.case-option.active{background:var(--surface);color:var(--ink);box-shadow:0 3px 10px var(--shadow)}
.case-option:active{transform:scale(.97)}
.start{height:clamp(54px,calc(60px * var(--fit)),66px);border:0;border-radius:999px;background:var(--dark-key);color:var(--paper);font-weight:950;padding:0 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 7px 0 var(--shadow)}
.start:active{transform:translateY(4px);box-shadow:0 3px 0 var(--shadow)}
.start b{width:34px;height:34px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#111}

/* Game is a set of three independent regions. Their relationship changes;
   the regions themselves retain stable minimum sizes. */
.game.active{display:grid;width:100%;min-height:0;min-width:0;gap:var(--gap-3);align-items:stretch}
.progress-panel,.play-panel,.control-panel{min-width:0;min-height:0}
.progress-panel{display:grid;place-items:center;align-content:center}
.progress-grid{display:grid;gap:var(--gap-1);justify-content:center;align-content:center}
.progress-cell{width:var(--progress-size);height:var(--progress-size);border-radius:clamp(7px,calc(10px * var(--fit)),12px);background:var(--soft);transition:background .25s,transform .25s,box-shadow .25s}
.progress-cell.ok{background:var(--ok);transform:scale(1.03)}
.progress-cell.bad{background:var(--bad);transform:scale(1.03)}
.progress-cell.current{box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 8%,transparent) inset}
.play-panel{
  display:grid;grid-template-rows:auto auto auto minmax(0,auto);align-content:center;justify-items:center;
  gap:var(--gap-2);container-type:inline-size;container-name:play;
}
.word-meta{text-align:center;font-weight:950;font-size:var(--meta-size);letter-spacing:-.02em;color:var(--muted);margin:0}
.timer-wrap{text-align:center;line-height:.9;white-space:nowrap}
.timer{font-size:var(--timer-size);font-weight:950;letter-spacing:-.055em}
.timer-wrap small{font-size:clamp(20px,calc(27px * var(--fit)),32px);color:var(--muted);margin-left:4px;font-weight:850}
.slots{display:flex;justify-content:center;gap:var(--gap-1);min-height:var(--slot-h);margin:0;max-width:100%;white-space:nowrap}
.slot{width:var(--slot-w);height:var(--slot-h);border:3px solid var(--line);border-radius:clamp(11px,calc(15px * var(--fit)),17px);display:grid;place-items:center;font-size:clamp(22px,calc(29px * var(--fit)),33px);font-weight:950;transition:border-color .24s ease,background .24s ease,transform .32s cubic-bezier(.2,.8,.2,1),box-shadow .24s ease;color:var(--ink);background:var(--surface);backdrop-filter:blur(8px);overflow:hidden}
.slot.filled{border-color:var(--ink)}.slot.reveal{border-color:var(--accent);color:var(--accent)}
.slot .slot-char{display:block;will-change:transform,opacity;animation:slotIn .34s cubic-bezier(.2,.85,.25,1) both}
.slot.removing .slot-char{animation:slotOut .26s cubic-bezier(.4,0,.8,.2) both}
@keyframes slotIn{0%{opacity:0;transform:translateY(14px) scale(.72) rotate(-4deg)}70%{opacity:1;transform:translateY(-2px) scale(1.06) rotate(1deg)}100%{opacity:1;transform:none}}
@keyframes slotOut{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(12px) scale(.72) rotate(3deg)}}
.letters{display:grid;grid-template-columns:repeat(5,var(--letter-size));justify-content:center;align-content:center;gap:var(--gap-2);width:100%;margin:calc(var(--gap-1) / 2) auto 0}
.letter{width:var(--letter-size);height:var(--letter-size);border:0;border-radius:50%;background:var(--tile);font-size:var(--letter-font);font-weight:950;box-shadow:0 5px 0 var(--key-shadow),0 10px 24px var(--shadow);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .24s ease,background .24s ease,color .24s ease,opacity .24s ease;will-change:transform}
.letter:active{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 var(--key-shadow);filter:brightness(.94)}
.letter.selected{background:var(--dark-key);color:var(--paper);box-shadow:0 5px 0 var(--dark-key-shadow);transform:translateY(-2px) scale(.96)}
.letter.returning{animation:letterReturn .34s cubic-bezier(.2,.85,.25,1)}
@keyframes letterReturn{0%{transform:translateY(-2px) scale(.96)}55%{transform:translateY(3px) scale(1.05)}100%{transform:none}}
.control-panel{display:grid;align-content:center;gap:var(--gap-1)}
.hint-actions,.bottom-actions{display:grid;gap:var(--gap-1)}
.pill{border:0;border-radius:999px;background:var(--button-soft);backdrop-filter:blur(8px);padding:8px 12px;font-weight:900;color:var(--muted);font-size:clamp(13px,calc(14px * var(--fit)),16px);min-height:var(--control-h)}
.pill.hint-kind{background:var(--surface-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 7%,transparent)}
.pill:active{transform:scale(.97);filter:brightness(.96)}
.pill.primary{background:var(--dark-key);color:var(--paper)}
.pill:disabled{opacity:.35}
.feedback{min-height:24px;text-align:center;font-weight:900;font-size:clamp(12px,calc(14px * var(--fit)),15px);display:grid;place-items:center}
.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}

/* Portrait: a single flow. Components may wrap internally, the page never overlaps. */
.app[data-layout="portrait"] .game{grid-template-areas:"progress" "play" "controls";grid-template-rows:auto minmax(0,1fr) auto;justify-items:center;padding:var(--gap-1) 0}
.app[data-layout="portrait"] .progress-panel{grid-area:progress}
.app[data-layout="portrait"] .play-panel{grid-area:play;width:min(100%,560px)}
.app[data-layout="portrait"] .control-panel{grid-area:controls;width:min(100%,560px)}
.app[data-layout="portrait"] .progress-grid{grid-template-columns:repeat(4,var(--progress-size))}
.app[data-layout="portrait"] .hint-actions,.app[data-layout="portrait"] .bottom-actions{grid-template-columns:repeat(2,minmax(0,1fr))}

/* Compact landscape: progress becomes a top status rail, game and actions get separate columns. */
.app[data-layout="compact"] .game{grid-template-areas:"progress progress" "play controls";grid-template-columns:minmax(390px,1fr) minmax(210px,280px);grid-template-rows:auto minmax(0,1fr);padding:var(--gap-1) 0}
.app[data-layout="compact"] .progress-panel{grid-area:progress}
.app[data-layout="compact"] .play-panel{grid-area:play}
.app[data-layout="compact"] .control-panel{grid-area:controls}
.app[data-layout="compact"] .progress-grid{grid-template-columns:repeat(12,var(--progress-size))}
.app[data-layout="compact"] .hint-actions,.app[data-layout="compact"] .bottom-actions{grid-template-columns:1fr}

/* Spacious landscape: three stable regions, no absolute positioning and no bottom overlay. */
.app[data-layout="spacious"] .game{grid-template-areas:"progress play controls";grid-template-columns:minmax(145px,190px) minmax(430px,1fr) minmax(220px,290px);grid-template-rows:minmax(0,1fr);padding:var(--gap-2) 0}
.app[data-layout="spacious"] .progress-panel{grid-area:progress}
.app[data-layout="spacious"] .play-panel{grid-area:play}
.app[data-layout="spacious"] .control-panel{grid-area:controls}
.app[data-layout="spacious"] .progress-grid{grid-template-columns:repeat(3,var(--progress-size))}
.app[data-layout="spacious"] .hint-actions,.app[data-layout="spacious"] .bottom-actions{grid-template-columns:1fr}

/* The play component decides its own internal wrapping from its actual width. */
@container play (width < 500px){
  .letters{grid-template-columns:repeat(3,var(--letter-size));max-width:calc(var(--letter-size) * 3 + var(--gap-2) * 2)}
}
@container play (width < 310px){
  .letters{grid-template-columns:repeat(2,var(--letter-size));max-width:calc(var(--letter-size) * 2 + var(--gap-2))}
}

/* Card treatment is cosmetic. Layout mode still comes from actual observed app space. */
@media (min-width:700px){
  body{display:grid;place-items:center;padding:12px}
  body[data-overflow="true"]{place-items:start center}
  .app{width:min(96vw,1260px);height:min(920px,calc(100dvh - 24px));padding:18px clamp(22px,3vw,38px) 24px;border-radius:30px;background:color-mix(in srgb,var(--surface) 90%,transparent);box-shadow:0 24px 80px var(--shadow),inset 0 0 0 1px color-mix(in srgb,var(--ink) 7%,transparent);backdrop-filter:blur(18px)}
  .app[data-overflow="true"]{height:auto;min-height:calc(100dvh - 24px)}
}

/* Accessibility and safety floors. */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
.result{flex-direction:column;justify-content:center;text-align:center;padding:20px 0}
.result h2{font-size:23px;margin:0 0 15px}.score{font-size:80px;font-weight:950;letter-spacing:-.07em}.score small{font-size:26px;color:var(--muted);letter-spacing:0}.result p{color:var(--muted);line-height:1.7}.result-actions{display:grid;gap:10px;margin-top:20px}.result-actions button{height:52px;border-radius:999px;font-weight:950}.share{border:0;background:var(--dark-key);color:var(--paper)}.again{border:2px solid var(--ink);background:var(--surface);color:var(--ink)}.review-list{margin-top:18px;text-align:left;max-height:22vh;overflow:auto}.review-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 12%,transparent);font-weight:800}.review-item span{color:var(--muted);font-weight:600}
.shake{animation:shake .25s linear}.pop{animation:pop .36s ease}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}@keyframes pop{50%{transform:scale(1.02)}}

</style>
</head>
<body>
<canvas id="ambient"></canvas>
<main class="app" data-layout="portrait" data-overflow="false">
<header class="top"><div class="logo" aria-label="词觉 LexiSense"><span class="brand-cn">词觉</span><span class="brand-en">LEXISENSE</span></div><div class="top-actions"><button class="icon" id="themeBtn" aria-label="切换夜间模式">☾</button><button class="icon" id="soundBtn" aria-label="声音">♪</button></div></header>
<section class="screen home active" id="home"><div class="mini">LEXISENSE · DAILY WORD CHALLENGE</div><h1>测测你的<br>单词直觉</h1><p>每天 12 个词，在倒计时结束前，用全部字母拼出正确答案。两三分钟，看看你今天的词觉有多敏锐。</p><div class="case-picker" role="group" aria-label="字母显示模式"><button class="case-option active" id="upperMode">ABC 大写</button><button class="case-option" id="lowerMode">abc 小写</button></div><button class="start" id="startBtn"><span>开始今日词觉</span><b>→</b></button></section>
<section class="screen game" id="game">
  <aside class="progress-panel" aria-label="挑战进度">
    <div class="progress-grid" id="progressGrid"></div>
  </aside>
  <section class="play-panel" aria-label="拼词区域">
    <div class="word-meta">WORD <span id="wordNo">1</span>/12</div>
    <div class="timer-wrap"><span class="timer" id="timer">30</span><small>s</small></div>
    <div class="slots" id="slots"></div>
    <div class="letters" id="letters"></div>
  </section>
  <aside class="control-panel" aria-label="提示与操作">
    <div class="hint-actions">
      <button class="pill hint-kind" id="zhHintBtn">中文提示 1</button>
      <button class="pill hint-kind" id="letterHintBtn">字母提示 3</button>
    </div>
    <div class="bottom-actions">
      <button class="pill" id="clearBtn">清空</button>
      <button class="pill primary" id="submitBtn">提交</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </aside>
</section>
<section class="screen result" id="result"><h2>今日词觉完成</h2><div class="score"><span id="score">0</span><small>/12</small></div><p id="summary"></p><div class="result-actions"><button class="share" id="shareBtn">分享成绩</button><button class="again" id="againBtn">再测一次</button></div><div class="review-list" id="reviewList"></div></section>
</main>

submitBtn.onclick=()=>{if(selected.length+lockedHints.length!==BANK[idx].word.length){feedback.textContent='请使用全部字母';feedback.className='feedback bad';play('wrong');return}const unlockedPositions=[];for(let i=0;i<BANK[idx].word.length;i++)if(!lockedHints.some(x=>x.pos===i))unlockedPositions.push(i);const answer=Array(BANK[idx].word.length).fill('');lockedHints.forEach(x=>answer[x.pos]=x.ch);selected.forEach((x,j)=>answer[unlockedPositions[j]]=x.ch);finish(answer.join('')===BANK[idx].word,false)}
function finish(ok,timeout){clearInterval(timerId);results[idx]=ok?'ok':'bad';feedback.textContent=ok?formatWord(BANK[idx].word)+' · '+BANK[idx].zh:(timeout?'时间到 · ':'答案是 · ')+formatWord(BANK[idx].word);feedback.className='feedback '+(ok?'ok':'bad');const target=$('#game');target.classList.remove('shake','pop');void target.offsetWidth;target.classList.add(ok?'pop':'shake');play(ok?'correct':'wrong');vibrate(ok?[18,35,28]:[35,45,35]);if(ok)score++;setTimeout(()=>{idx++;if(idx>=TOTAL)endGame();else render()},950)}
function startGame(){unlockAudio();idx=0;score=0;letterHints=3;zhHints=1;results=[];letterHintBtn.textContent='字母提示 3';letterHintBtn.disabled=false;zhHintBtn.textContent='中文提示 1';zhHintBtn.disabled=false;initProgress();show('game');play('start');render()}
function endGame(){clearInterval(timerId);show('result');$('#score').textContent=score;$('#summary').textContent=score>=10?'你的词觉很敏锐，识别速度和稳定性都很强。':score>=7?'词觉表现稳定，再熟悉一些高频词就会更快。':'今天先到这里，错词会保留在下面，明天再测一次。';reviewList.innerHTML='';BANK.forEach((w,i)=>{if(results[i]==='bad'){const d=document.createElement('div');d.className='review-item';d.innerHTML='<strong>'+formatWord(w.word)+'</strong><span>'+w.zh+'</span>';reviewList.appendChild(d)}})}
upperMode.onclick=()=>setLetterCase('upper');lowerMode.onclick=()=>setLetterCase('lower');syncCasePicker();
startBtn.onclick=startGame;againBtn.onclick=startGame;shareBtn.onclick=async()=>{const text='词觉 LexiSense：我今天的 12 词挑战答对了 '+score+'/12。来测测你的单词直觉。';try{await navigator.share({text})}catch{await navigator.clipboard.writeText(text);shareBtn.textContent='已复制';setTimeout(()=>shareBtn.textContent='分享成绩',1200)}}
themeBtn.onclick=()=>{themePref=resolvedTheme()==='dark'?'light':'dark';localStorage.setItem('wordfeel-theme',themePref);applyTheme();vibrate(8)}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(themePref==='system')applyTheme()});
soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'♪':'×';if(soundOn){unlockAudio();play('tile')}}

// Adaptive Layout Contract: actual container space chooses the layout.
// Width changes structure; height changes the shared scale; insufficient
// space degrades to scrolling rather than overlap or clipping.
const appShell=document.querySelector('.app');
const layoutContracts={
  portrait:{idealW:390,idealH:760,minW:300,minH:640,minFit:.76},
  compact:{idealW:900,idealH:520,minW:660,minH:390,minFit:.72},
  spacious:{idealW:1180,idealH:700,minW:920,minH:460,minFit:.70}
};
let layoutRaf=0;
function chooseAdaptiveLayout(width,height){
  const ratio=width/Math.max(height,1);
  if(width>=920&&height>=460&&ratio>=1.32)return 'spacious';
  if(width>=660&&height>=390&&ratio>=1.12)return 'compact';
  return 'portrait';
}
function applyAdaptiveLayout(){
  cancelAnimationFrame(layoutRaf);
  layoutRaf=requestAnimationFrame(()=>{
    const rect=appShell.getBoundingClientRect();
    const width=rect.width,height=Math.min(rect.height,window.visualViewport?.height||window.innerHeight);
    const mode=chooseAdaptiveLayout(width,height);
    const contract=layoutContracts[mode];
    const fit=Math.max(contract.minFit,Math.min(1.08,width/contract.idealW,height/contract.idealH));
    const mustScroll=width<contract.minW||height<contract.minH;
    appShell.dataset.layout=mode;
    appShell.dataset.overflow=String(mustScroll);
    appShell.style.setProperty('--fit',fit.toFixed(3));
    document.body.dataset.overflow=String(mustScroll);
  });
}
new ResizeObserver(applyAdaptiveLayout).observe(appShell);
window.visualViewport?.addEventListener('resize',applyAdaptiveLayout);
window.addEventListener('orientationchange',applyAdaptiveLayout);
applyAdaptiveLayout();

initProgress();applyTheme();
// lightweight ambient canvas: avoids a heavy Three.js dependency while preserving the same depth cue.
const cv=$('#ambient'),ctx=cv.getContext('2d');let W=0,H=0,pts=[];
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);pts=Array.from({length:14},(_,i)=>({x:Math.random()*W,y:Math.random()*H,r:8+Math.random()*24,vx:(Math.random()-.5)*.08,vy:(Math.random()-.5)*.06,a:.025+Math.random()*.05}))}
function draw(){ctx.clearRect(0,0,W,H);const css=getComputedStyle(document.documentElement);const glow=css.getPropertyValue('--glow').trim()||'rgba(241,154,84,.15)';for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<-40)p.x=W+40;if(p.x>W+40)p.x=-40;if(p.y<-40)p.y=H+40;if(p.y>H+40)p.y=-40;ctx.globalAlpha=p.a;ctx.fillStyle=glow;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(draw)}
addEventListener('resize',resize);resize();draw();
</script>
