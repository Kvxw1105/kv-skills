<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fff9ef"><title>12词感</title><style>
:root{--bg:#fff9ef;--ink:#17181c;--muted:#74757b;--tile:#ece6da;--soft:#ddd8ce;--line:#97979b;--surface:#ffffffc9;--accent:#f19a54;--ok:#2bb16b;--bad:#ef625c;--shadow:#4b351719}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 70% 15%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 34%),var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang SC",system-ui,sans-serif;transition:.4s}body.dark{--bg:#101116;--ink:#f4f1e9;--muted:#aaaab2;--tile:#292a32;--soft:#35363f;--line:#74757e;--surface:#202129db;--shadow:#0007}.app{width:min(100%,520px);height:100dvh;margin:auto;padding:max(8px,env(safe-area-inset-top)) 16px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{height:38px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:950;font-size:18px;letter-spacing:-.04em}.logo b{color:var(--accent)}.icons{display:flex;gap:8px}.icon{width:34px;height:34px;border:0;border-radius:50%;background:var(--surface);font-size:17px}.screen{display:none;flex:1;min-height:0}.screen.on{display:flex}.home{flex-direction:column;justify-content:center;padding-bottom:7vh}.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:900;color:var(--muted)}h1{font-size:clamp(54px,16vw,82px);line-height:.92;letter-spacing:-.075em;margin:14px 0 20px}p{color:var(--muted);font-weight:650;line-height:1.65}.switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;border-radius:999px;background:var(--tile);margin:8px 0 18px}.switch button,.start,.pill{border:0;font-weight:900}.switch button{height:40px;border-radius:999px;background:transparent;color:var(--muted)}.switch button.on{background:var(--surface);color:var(--ink)}.start{height:58px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:16px;box-shadow:0 7px 0 var(--shadow)}.start:active{transform:translateY(4px);box-shadow:0 3px 0 var(--shadow)}.game{flex-direction:column;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:min(56vw,220px);margin-top:4px}.cell{aspect-ratio:1;border-radius:10px;background:var(--soft);transition:.25s}.cell.ok{background:var(--ok)}.cell.bad{background:var(--bad)}.middle{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}.meta{font-weight:950;color:var(--muted)}.time{font-size:clamp(58px,18vw,82px);font-weight:950;line-height:1;margin:5px 0 12px}.slots{display:flex;gap:7px;margin-bottom:18px}.slot{width:clamp(40px,11vw,52px);height:clamp(46px,12vw,60px);border:3px solid var(--line);border-radius:14px;display:grid;place-items:center;background:var(--surface);font-size:28px;font-weight:950}.slot.lock{border-color:var(--accent);color:var(--accent)}.char{animation:in .25s cubic-bezier(.2,.8,.2,1)}@keyframes in{from{opacity:0;transform:translateY(10px) scale(.75)}70%{transform:translateY(-2px) scale(1.06)}}.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:min(88vw,360px)}.letter{width:clamp(66px,20vw,88px);height:clamp(66px,20vw,88px);border:0;border-radius:50%;background:var(--tile);font-size:32px;font-weight:950;box-shadow:0 5px 0 var(--shadow);transition:.2s}.letter:active{transform:translateY(4px)}.letter.sel{background:var(--ink);color:var(--bg);transform:translateY(-2px) scale(.96)}.actions{width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.pill{min-height:40px;border-radius:999px;background:var(--surface);color:var(--muted)}.pill.primary{background:var(--ink);color:var(--bg)}.pill:disabled{opacity:.35}.feedback{height:22px;text-align:center;font-weight:900;font-size:14px;margin-top:5px}.result{flex-direction:column;justify-content:center;text-align:center}.score{font-size:78px;font-weight:950}.result button{height:52px;border-radius:999px;margin-top:8px}@media(max-height:690px){.grid{width:170px;gap:5px}.letter{width:62px;height:62px;font-size:26px}.time{font-size:54px}.slot{width:38px;height:44px}}
</style></head><body><main class="app"><header class="top"><div class="logo"><b>12</b> 词感</div><div class="icons"><button class="icon" id="theme">☾</button><button class="icon" id="sound">♪</button></div></header><section class="screen home on" id="home"><div class="eyebrow">DAILY WORD CHALLENGE</div><h1>每天<br>12 个词</h1><p>在时间结束前，用全部字母拼出正确单词。两三分钟，测测今天的词感。</p><div class="switch"><button class="on" id="upper">ABC 大写</button><button id="lower">abc 小写</button></div><button class="start" id="start">开始今日挑战</button></section><section class="screen game" id="game"><div class="grid" id="grid"></div><div class="middle"><div class="meta">WORD <span id="no">1</span>/12</div><div class="time"><span id="timer">30</span><small>s</small></div><div class="slots" id="slots"></div><div class="letters" id="letters"></div></div><div class="actions"><div class="row"><button class="pill" id="zh">中文提示 1</button><button class="pill" id="hint">字母提示 3</button></div><div class="row"><button class="pill" id="clear">清空</button><button class="pill primary" id="submit">提交</button></div><div class="feedback" id="feedback"></div></div></section><section class="screen result" id="result"><h2>今日挑战完成</h2><div class="score"><span id="score">0</span><small>/12</small></div><p id="summary"></p><button class="pill primary" id="again">再玩一局</button></section></main><script>
const words=[['match','匹配；比赛'],['dream','梦想'],['quiet','安静的'],['focus','专注'],['smart','聪明的'],['learn','学习'],['light','光；轻的'],['brave','勇敢的'],['world','世界'],['clear','清楚的'],['sound','声音'],['quick','迅速的']].map(([word,zh])=>({word,zh})),TOTAL=12,$=s=>document.querySelector(s);let i=0,score=0,results=[],selected=[],locked=[],order=[],left=30,tick,letterHints=3,zhHints=1,lowercase=localStorage.case==='lower',soundOn=true,ac;function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on')}function fmt(x){return lowercase?x.toLowerCase():x.toUpperCase()}function audio(kind){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const map={tap:[520,.05],back:[390,.04],hint:[820,.1],wrong:[210,.16],good:[760,.18],start:[620,.12]},[f,d]=map[kind],o=ac.createOscillator(),g=ac.createGain();o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.07,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}function vib(x){navigator.vibrate?.(x)}function shuffle(s){return[...s].sort(()=>Math.random()-.5)}function initGrid(){grid.innerHTML='';for(let n=0;n<TOTAL;n++)grid.appendChild(Object.assign(document.createElement('div'),{className:'cell'}))}function paintGrid(){[...grid.children].forEach((c,n)=>c.className='cell '+(results[n]||''))}function freeSlots(){return[...Array(words[i].word.length).keys()].filter(p=>!locked.some(x=>x.pos===p))}function refresh(){const vals=Array(words[i].word.length).fill('');locked.forEach(x=>vals[x.pos]=fmt(x.ch));selected.forEach((x,n)=>{const p=freeSlots()[n];if(p!=null)vals[p]=fmt(x.ch)});[...slots.children].forEach((s,n)=>{s.className='slot'+(locked.some(x=>x.pos===n)?' lock':'');s.innerHTML=vals[n]?'<span class="char">'+vals[n]+'</span>':''});document.querySelectorAll('.letter').forEach((b,n)=>{const lk=locked.some(x=>x.idx===n);b.classList.toggle('sel',lk||selected.some(x=>x.idx===n));b.disabled=lk})}function choose(idx,b){const p=selected.findIndex(x=>x.idx===idx);if(p>=0){selected.splice(p,1);audio('back')}else{selected.push({idx,ch:order[idx]});audio('tap')}vib(8);refresh()}function render(){clearInterval(tick);selected=[];locked=[];order=shuffle(words[i].word);no.textContent=i+1;left=30;timer.textContent=left;feedback.textContent='';slots.innerHTML='';letters.innerHTML='';order.forEach(()=>slots.appendChild(Object.assign(document.createElement('div'),{className:'slot'})));order.forEach((ch,n)=>{const b=document.createElement('button');b.className='letter';b.textContent=fmt(ch);b.onclick=()=>choose(n,b);letters.appendChild(b)});paintGrid();tick=setInterval(()=>{timer.textContent=--left;if(left<=0)finish(false,true)},1000)}function finish(ok,timeout=false){clearInterval(tick);results[i]=ok?'ok':'bad';feedback.textContent=ok?fmt(words[i].word)+' · '+words[i].zh:(timeout?'时间到 · ':'答案是 · ')+fmt(words[i].word);feedback.style.color=ok?'var(--ok)':'var(--bad)';audio(ok?'good':'wrong');vib(ok?[15,30,20]:[30,35,30]);if(ok)score++;setTimeout(()=>{if(++i>=TOTAL)end();else render()},850)}function begin(){i=score=0;results=[];letterHints=3;zhHints=1;hint.textContent='字母提示 3';hint.disabled=false;zh.textContent='中文提示 1';zh.disabled=false;initGrid();show('game');audio('start');render()}function end(){show('result');$('#score').textContent=score;summary.textContent=score>=10?'你的识别速度和稳定性都很强。':score>=7?'表现稳定，再熟悉一些高频词会更快。':'今天先到这里，明天再来一局。'}start.onclick=again.onclick=begin;clear.onclick=()=>{selected=[];audio('back');refresh()};zh.onclick=()=>{if(!zhHints)return;zhHints=0;zh.textContent='中文提示 0';zh.disabled=true;feedback.textContent='中文：'+words[i].zh;audio('hint')};hint.onclick=()=>{if(!letterHints)return;const pos=locked.length,target=words[i].word[pos],idx=order.findIndex((ch,n)=>ch===target&&!locked.some(x=>x.idx===n));selected=selected.filter(x=>x.idx!==idx);locked.push({pos,idx,ch:target});hint.textContent='字母提示 '+(--letterHints);hint.disabled=!letterHints;audio('hint');refresh()};submit.onclick=()=>{if(selected.length+locked.length!==words[i].word.length){feedback.textContent='请使用全部字母';return audio('wrong')}const ans=Array(words[i].word.length).fill('');locked.forEach(x=>ans[x.pos]=x.ch);selected.forEach((x,n)=>ans[freeSlots()[n]]=x.ch);finish(ans.join('')===words[i].word)};function setCase(v){lowercase=v;localStorage.case=v?'lower':'upper';upper.classList.toggle('on',!v);lower.classList.toggle('on',v);document.querySelectorAll('.letter').forEach((b,n)=>b.textContent=fmt(order[n]||''));refresh()}upper.onclick=()=>setCase(false);lower.onclick=()=>setCase(true);setCase(lowercase);theme.onclick=()=>{document.body.classList.toggle('dark');theme.textContent=document.body.classList.contains('dark')?'☀':'☾'};sound.onclick=()=>{soundOn=!soundOn;sound.textContent=soundOn?'♪':'×'};initGrid();
</script></body></html>
